name: Build and publish one Android APK
on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      device:
        type: string
        required: true
      beta_number:
        type: string
        required: true

env:
  BETA_NUMBER: ${{ inputs.beta_number }}
  DEVICE: ${{ inputs.device }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Build and test
        working-directory: apps/${{ inputs.project }}
        shell: bash
        run: |
          set -eu
          [[ "$BETA_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'Enter a positive beta number of up to nine digits.'; exit 1; }
          bash ../patient_mobile/gradlew --no-configuration-cache :app:test :app:assembleRelease "-PreleaseCode=$BETA_NUMBER" "-PreleaseName=beta-$BETA_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ inputs.device }}
          path: apps/${{ inputs.project }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: android-beta
    permissions:
      contents: write
    concurrency: android-beta-publication-${{ inputs.device }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-${{ inputs.device }}
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Sign and verify the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -eu
          umask 077
          key="$RUNNER_TEMP/glycotwin.p12"
          trap 'rm -f "$key"' EXIT
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$key" || [[ ! -s "$key" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty or is not valid Base64."
            exit 1
          fi
          if ! keytool -list -storetype PKCS12 -keystore "$key" -storepass:env KEYSTORE_PASSWORD >/dev/null 2>&1; then
            # Compare only on failure. A re-export of the same signing key can have different file bytes.
            if printf '%s  %s\n' '72824f766864bd77ec5f0f5ebf14580172a105c00fb7494ef481e211a0a967fe' "$key" | sha256sum --check --status; then
              echo "::error::The keystore matches the original file. Check ANDROID_KEYSTORE_PASSWORD."
            else
              echo "::error::The decoded keystore differs from the original glycotwin.p12 and cannot be opened. Check ANDROID_KEYSTORE_BASE64 first."
            fi
            exit 1
          fi
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          apk="glycotwin-$DEVICE.apk"
          "$sdk/apksigner" sign --ks-type PKCS12 --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$apk" "app-release-unsigned.apk"
          cert=$("$sdk/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$cert"
          test "$cert" = "$EXPECTED_CERT"
          "$sdk/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging"
          grep -F "package: name='me.glycotwin.patient' versionCode='$BETA_NUMBER'" "$RUNNER_TEMP/badging"
          sha256sum "$apk" > SHA256SUMS.txt
      - name: Publish beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="android-$DEVICE-beta-$BETA_NUMBER"
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          latest=$(sed -nE "s/^android-($DEVICE-)?beta-([0-9]+)$/\2/p" <<< "$tags" | sort -nr | sed -n '1p')
          (( BETA_NUMBER > ${latest:-0} )) || { echo "Choose a version higher than $latest for $DEVICE."; exit 1; }
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')
          if grep -Fxq "refs/tags/$tag" <<< "$refs"; then echo 'That tag already exists.'; exit 1; fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GlycoTwin $DEVICE beta $BETA_NUMBER" --notes "Android tester build. Use synthetic data." "glycotwin-$DEVICE.apk" SHA256SUMS.txt
