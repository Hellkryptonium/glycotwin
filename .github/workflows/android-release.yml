name: Build one Android APK
on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      device:
        type: string
        required: true
      beta_number:
        type: string
        required: true

env:
  BETA_NUMBER: ${{ inputs.beta_number }}
  DEVICE: ${{ inputs.device }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Build and test
        working-directory: apps/${{ inputs.project }}
        shell: bash
        run: |
          set -eu
          [[ "$BETA_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'Enter a positive beta number of up to nine digits.'; exit 1; }
          bash ../patient_mobile/gradlew --no-configuration-cache :app:test :app:assembleRelease "-PreleaseCode=$BETA_NUMBER" "-PreleaseName=beta-$BETA_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ inputs.device }}
          path: apps/${{ inputs.project }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1
