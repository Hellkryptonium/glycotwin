name: Android beta
on:
  workflow_dispatch:
    inputs:
      beta_number:
        description: 'Next Android beta version code (positive integer)'
        required: true
        type: string

env:
  BETA_NUMBER: ${{ inputs.beta_number }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: patient_mobile
            asset: phone
          - project: wearable
            asset: watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build and test
        working-directory: apps/${{ matrix.project }}
        shell: bash
        run: |
          set -eu
          [[ "$BETA_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'Enter a positive beta number of up to nine digits.'; exit 1; }
          bash ../patient_mobile/gradlew --no-configuration-cache :app:test :app:assembleRelease "-PreleaseCode=$BETA_NUMBER" "-PreleaseName=beta-$BETA_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.asset }}
          path: apps/${{ matrix.project }}/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: android-beta
    permissions:
      contents: write
    concurrency: android-beta-publication
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Sign and verify both APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -eu
          umask 077
          key="$RUNNER_TEMP/glycotwin.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          for target in phone watch; do
            apk="glycotwin-$target.apk"
            "$sdk/apksigner" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$apk" "unsigned-$target/app-release-unsigned.apk"
            cert=$("$sdk/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test -n "$cert"
            test "$cert" = "$EXPECTED_CERT"
            "$sdk/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging"
            grep -F "package: name='me.glycotwin.patient' versionCode='$BETA_NUMBER'" "$RUNNER_TEMP/badging"
          done
          sha256sum glycotwin-{phone,watch}.apk > SHA256SUMS.txt
      - name: Publish beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' | sed -n 's/^android-beta-\([0-9]\+\)$/\1/p' | sort -nr | head -1)
          (( $BETA_NUMBER > ${latest:-0} ))
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/android-beta-$BETA_NUMBER" --jq '.[].ref')
          if grep -Fxq "refs/tags/android-beta-$BETA_NUMBER" <<< "$refs"; then echo 'That tag already exists. Choose a fresh beta number.'; exit 1; fi
          gh release create "android-beta-$BETA_NUMBER" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "GlycoTwin Android beta $BETA_NUMBER" --notes "Phone and Wear OS tester builds. Use synthetic data." glycotwin-phone.apk glycotwin-watch.apk SHA256SUMS.txt
